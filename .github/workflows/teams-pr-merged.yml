name: Microsoft Teams - Pull Request Notifications

on:
  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:

permissions: {}

jobs:
  notify-teams:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Send notification to Microsoft Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          test = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          pr = event.get("pull_request") or {}
          repository = os.environ["GITHUB_REPOSITORY"]

          if test:
              heading = "Teams Connection Test"
              title = "GitHub Actions connected successfully"
              details = [
                  ("Project", "J26-DS-310"),
                  ("Repository", repository),
                  ("Triggered by", os.environ["GITHUB_ACTOR"]),
                  ("Status", "TEST - Not a real merge")
              ]
              link = f"https://github.com/{repository}/actions"
          else:
              heading = "Pull Request Merged"
              title = pr.get("title", "Untitled pull request")
              details = [
                  ("Project", "J26-DS-310"),
                  ("PR Number", f"#{pr.get('number', '')}"),
                  ("Author", pr.get("user", {}).get("login", "")),
                  ("Source Branch", pr.get("head", {}).get("ref", "")),
                  ("Target Branch", pr.get("base", {}).get("ref", "")),
                  ("Status", "MERGED"),
                  ("Merged At (UTC)", pr.get("merged_at", ""))
              ]
              link = pr.get("html_url", f"https://github.com/{repository}")

          card = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.2",
              "body": [
                  {
                      "type": "TextBlock",
                      "text": "J26-DS-310 | RESEARCH PROJECT",
                      "weight": "Bolder",
                      "color": "Accent",
                      "size": "Small"
                  },
                  {
                      "type": "TextBlock",
                      "text": heading,
                      "weight": "Bolder",
                      "color": "Good",
                      "size": "Large",
                      "wrap": True
                  },
                  {
                      "type": "TextBlock",
                      "text": title,
                      "weight": "Bolder",
                      "wrap": True
                  },
                  {
                      "type": "FactSet",
                      "facts": [
                          {"title": key, "value": str(value)}
                          for key, value in details
                      ]
                  },
                  {
                      "type": "TextBlock",
                      "text": "Automated GitHub development update",
                      "isSubtle": True,
                      "size": "Small"
                  }
              ],
              "actions": [
                  {
                      "type": "Action.OpenUrl",
                      "title": "View on GitHub",
                      "url": link
                  }
              ]
          }

          payload = {
              "type": "message",
              "attachments": [
                  {
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "contentUrl": None,
                      "content": card
                  }
              ]
          }

          url = os.environ["TEAMS_WEBHOOK_URL"]

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print("Microsoft Teams response:", response.status)

          print("Notification request sent successfully.")
          PY
